name: Validar web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --requirement requirements.txt
      - run: npm run catalog:migrate:check
      - run: npm run catalog:generate
      - run: npm run catalog:validate
      - name: Comprobar artefactos generados
        run: git diff --exit-code -- data/generated/catalog.json data/generated/search-index.json data/generated/generation-report.json
      - run: npm test
      - run: npm run lint
      - name: Subir web compilada
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: out
